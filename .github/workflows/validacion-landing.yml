name: Verificación landing ejecutiva

on:
  push:
    branches:
      - mvp/landing-direccion-ejecutiva-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Analizar código
        run: npm run lint
      - name: Compilar Next.js
        run: npm run build
