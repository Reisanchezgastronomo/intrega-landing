name: Verificar vista previa publicada
on:
  push:
    branches: [main]
    paths:
      - "app/layout.tsx"
      - "app/opengraph-image.tsx"
      - ".github/workflows/verificar-tarjeta-whatsapp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vista-previa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validar imagen Open Graph en Netlify
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin
          import struct

          base="https://reisanchez-direccion-ejecutiva.netlify.app/"
          headers={"User-Agent":"facebookexternalhit/1.1"}

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags={}
              def handle_starttag(self,tag,attrs):
                  if tag=="meta":
                      attrs=dict(attrs)
                      key=attrs.get("property") or attrs.get("name")
                      if key: self.tags[key]=attrs.get("content")

          with urlopen(Request(base,headers=headers),timeout=20) as response:
              assert response.status==200,response.status
              html=response.read().decode("utf-8","replace")
          parser=Parser(); parser.feed(html)
          image=parser.tags.get("og:image")
          assert image and image.startswith(base+"opengraph-image"),image
          with urlopen(Request(urljoin(base,image),headers=headers),timeout=20) as response:
              assert response.status==200,response.status
              assert response.headers.get_content_type()=="image/png"
              data=response.read()

          assert data[:8]==bytes([137,80,78,71,13,10,26,10]),"PNG invalido"
          assert struct.unpack(">II",data[16:24])==(1200,630),"Tamano invalido"
          print("OK: Netlify entrega og:image publica, accesible y PNG 1200x630.")
          PY
